name: NexusAI-OS CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit and integration tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Deterministic end-to-end demo
        run: npm run demo
